; PlatformIO Configuration for MultiGauge Dual-MCU CAN Bus Architecture
;
; Build commands:
;   pio run -e sensor_mcu      # Build ESP32-C3 sensor firmware
;   pio run -e display_mcu     # Build ESP32-S3 display firmware
;   pio run -e sensor_mcu -t upload
;   pio run -e display_mcu -t upload
;   pio run -e display_demo -t upload   # Display with made-up values, no sensor node needed

[platformio]
default_envs = display_mcu

[env]
framework = arduino
monitor_speed = 115200
; Use pioarduino platform for Arduino ESP32 core 3.x
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.10/platform-espressif32.zip

; ============================================================
; ESP32-C3 Sensor MCU
; Reads sensors and transmits over CAN bus
; ============================================================
[env:sensor_mcu]
board = lolin_c3_mini
; Also works with Waveshare ESP32-C3-Zero and other ESP32-C3 boards with USB
build_flags =
    -D SENSOR_MCU
    -I include/shared
build_src_filter =
    +<sensor_mcu/>
lib_deps =
    adafruit/Adafruit MAX31855 library@^1.3.0
    adafruit/Adafruit ADS1X15@^2.5.0

; ============================================================
; CAN transceiver self-test (temporary)
; ============================================================
[env:can_test]
board = lolin_c3_mini
; Carrier board rev 2 pins (see src/sensor_mcu/sensor_config.h)
build_flags =
    -D CAN_TX_PIN=0
    -D CAN_RX_PIN=1
build_src_filter =
    +<can_test/>

[env:can_test_display]
board = adafruit_qualia_s3_rgb666
board_build.partitions = tinyuf2-partitions-16MB.csv
build_flags =
    -D CAN_TX_PIN=16
    -D CAN_RX_PIN=17
    -D ARDUINO_USB_CDC_ON_BOOT=1
build_src_filter =
    +<can_test/>

; ============================================================
; Touch controller test (CST826 on Qualia)
; ============================================================
[env:touch_test]
board = adafruit_qualia_s3_rgb666
board_build.partitions = tinyuf2-partitions-16MB.csv
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
build_src_filter =
    +<touch_test/>

; ============================================================
; ESP32-S3 Qualia Display MCU
; Receives CAN data and renders LVGL gauge display
; ============================================================
[env:display_mcu]
board = adafruit_qualia_s3_rgb666
board_build.partitions = tinyuf2-partitions-16MB.csv
; Building for speed (-O2 in place of the default -Os) was tried on 2026-11-18:
; no measurable change in frame rate, and 200 KB more flash. Left at the default.
build_flags =
    -D DISPLAY_MCU
    -D DEBUG=1
    -D DIRECT_MODE          ; LVGL renders straight into the RGB panel framebuffer (no copy on flush)
    ; LVGL's default is one frame per 33 ms. The panel refreshes every 25 ms, and each
    ; frame now waits for a refresh, so 33 ms would show every third frame twice
    ; (uneven motion). 16 ms lets LVGL keep up with every refresh, about 40 fps.
    -D LV_DEF_REFR_PERIOD=16
    ; LVGL's own memory pool. The default 64 KB was not enough: the centre circle's
    ; shadow needs one 45 KB block while it is drawn, and a view change ran out
    ; ("Out of memory" in lv_draw_sw_box_shadow, then a watchdog reboot).
    -D LV_MEM_SIZE=131072
    -D LV_CONF_INCLUDE_SIMPLE
    -D BOARD_HAS_PSRAM
    -D LV_FONT_MONTSERRAT_14=1
    -D LV_FONT_MONTSERRAT_18=1
    -D LV_FONT_MONTSERRAT_34=1
    -D LV_FONT_MONTSERRAT_24=1
    -D LV_FONT_MONTSERRAT_48=1
    -I include/shared
build_src_filter =
    +<display_mcu/>
    +<../assets/>
lib_deps =
    lvgl/lvgl@9.4.0   ; pinned: the tear-free flip code is written against 9.4, and every display build must use the same version
    ; GFX Library for Arduino is vendored + patched in lib/Arduino_GFX/
    ; (double-framebuffer / tear-free RGB panel support). Do NOT re-add it to
    ; lib_deps or the registry copy will shadow the fork.
    adafruit/Adafruit BMP280 Library@^2.6.8  ; Optional: atmospheric pressure (I2C)

; ============================================================
; Display demo: the display firmware with made-up sensor values
; Sweeps the needle and every readout so the screen can be checked with no
; sensor node. CAN is off. "DEMO" shows next to the FPS count. Flash
; display_mcu again before the display goes in the van.
; ============================================================
[env:display_demo]
extends = env:display_mcu
build_flags =
    ${env:display_mcu.build_flags}
    -D DEMO_MODE
    -D DISPLAY_TIMING       ; print frame timing, LVGL heap and reset reason once a second

; Same demo with the old partial-buffer rendering, for comparing against direct mode.
[env:display_demo_partial]
extends = env:display_demo
build_unflags = -D DIRECT_MODE
